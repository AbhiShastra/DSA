name: Simple AI Code Review

on:
  pull_request:
    branches: [main, master]

jobs:
  ai-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: AI Code Reviewer
        uses: freeedcom/ai-codereviewer@main
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_MODEL: "gpt-3.5-turbo" # or "gpt-4" if you have access
          exclude: "*.json,*.md,*.yml,*.yaml,package-lock.json"
          # Custom instructions for DSA review
          custom_prompt: |
            You are reviewing Data Structures and Algorithms code. Please focus on:

            1. **Algorithm Efficiency**: Check time and space complexity
            2. **Correctness**: Verify the algorithm logic is sound  
            3. **Edge Cases**: Ensure edge cases are handled
            4. **Code Quality**: Check for readability and best practices
            5. **Testing**: Verify test coverage is adequate

            Provide specific, actionable feedback for improvement.
